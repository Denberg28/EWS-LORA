name: Firmware and Windows monitor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the named bench-test prerelease after checks pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: ./scripts/check.sh
      - run: git diff-tree --check --root HEAD
      - run: python -m pip install -r requirements-build.txt
      - run: pio run -e base -e node -e rover
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ews-lora-test-candidate
          path: dist/
          if-no-files-found: error

  monitor:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.419'
      - name: Test and package Windows x64 monitor
        shell: pwsh
        run: |
          dotnet run --project tests/monitor/MonitorTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Monitor tests failed' }
          dotnet publish monitor/EwsMonitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o monitor-build
          if ($LASTEXITCODE -ne 0) { throw 'Monitor build failed' }
          $process = Start-Process (Resolve-Path 'monitor-build/EWS-LoRa-Monitor.exe') -ArgumentList '--smoke' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Monitor startup timed out' }
          if ($process.ExitCode -ne 0) { throw 'Monitor smoke test failed' }
          Copy-Item monitor/START-HERE.txt,monitor/ANCHORS-TEMPLATE.csv monitor-build/
          $version = (Get-Content VERSION).Trim()
          "Version: $version`nCommit: $env:GITHUB_SHA`nRuntime: win-x64 (self-contained)" | Set-Content monitor-build/BUILD-WINDOWS.txt
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path monitor-build/* -DestinationPath "dist/ews-lora-$version-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ews-lora-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    if: >-
      github.repository == 'Denberg28/EWS-LORA' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.publish == true)
    needs: [verify, monitor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency: ews-lora-prerelease
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ews-lora-test-candidate
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ews-lora-windows-x64
          path: dist
      - name: Publish controlled-test candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
          TAG: v0.5.0-rc.1
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          grep -Fx "Commit: $SOURCE" BUILD.txt
          grep -Fx "Version: $TAG" BUILD.txt
          windows="ews-lora-$TAG-windows-x64.zip"
          unzip -t "$windows"
          unzip -p "$windows" BUILD-WINDOWS.txt | tr -d '\r' | grep -Fx "Commit: $SOURCE"
          sha256sum "$windows" >> SHA256SUMS
          sha256sum --check SHA256SUMS
          if [[ $(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha) != "$SOURCE" ]]; then
            echo "A newer commit is on main. Skipping superseded candidate."
            exit 0
          fi
          if gh release view "$TAG" --json isDraft > release.json 2> /dev/null; then
            if grep -q '"isDraft":true' release.json; then
              echo "Existing draft needs inspection before publication."
              exit 1
            fi
            echo "Candidate already published. No release assets were changed."
            exit 0
          fi
          gh release create "$TAG" --target "$SOURCE" --draft --prerelease --latest=false \
            --title "EWS LORA $TAG — hardware test candidate" \
            --notes "Bench-test candidate for Base, Relay Node and Rover on LilyGO T3-S3 SX1262 915 MHz boards. Includes the Windows x64 Fleet Monitor. Host protocol checks, firmware builds and the Windows smoke test passed on this source. Hardware validation and field coverage are blocked pending physical tests. Use in controlled validation only. See README.md and docs/TESTING.md for provisioning, compatibility, rollback, and HIL." \
            ews-lora-"$TAG"-{base,node,rover}{,-app}.bin "$windows" BUILD.txt SHA256SUMS
          gh release edit "$TAG" --draft=false --prerelease --latest=false
